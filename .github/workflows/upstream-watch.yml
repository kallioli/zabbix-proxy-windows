name: Upstream watch

# Every Monday, carry the port onto the newest Zabbix release of each watched
# series (the one in UPSTREAM_VERSION and the next one) and report what no
# longer applies. It builds nothing and blocks nothing: it says early how much
# work the next release will be, instead of finding out on release day.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Zabbix tag to try (empty = newest of each watched series)"
        required: false

permissions:
  contents: read

jobs:
  pick:
    name: Pick the releases to try
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # One series per branch: main (the current line) and every branch named
      # like a series (7.4). Each is tried against the newest release of its
      # own series; main also against the next series, since that is where the
      # port goes next. Release candidates count: that is when the work starts.
      - id: pick
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            echo "matrix=[{\"branch\":\"main\",\"version\":\"$INPUT\"}]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tags=$(git ls-remote --tags https://github.com/zabbix/zabbix | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '{}')
          newest() { echo "$tags" | grep -E "^$1[.][0-9]+((alpha|beta|rc)[0-9]+)?$" | awk '{ print ($0 ~ /(alpha|beta|rc)/) ? $0 : $0 "zz" }' | sort -V | tail -1 | sed 's/zz$//'; }
          next_series() { IFS=. read -r M m <<< "$1"; if [ "$m" -ge 4 ]; then echo "$((M + 1)).0"; else echo "$M.$((m + 2))"; fi; }
          branches=$(git ls-remote --heads origin | awk '{print $2}' | sed 's|refs/heads/||' | grep -E '^(main|[0-9]+[.][0-9]+)$')
          list=()
          for b in $branches; do
            git fetch --quiet --depth 1 origin "$b"
            current=$(git show FETCH_HEAD:UPSTREAM_VERSION | tr -d '[:space:]')
            series=${current%.*}
            v=$(newest "$series")
            [ -n "$v" ] && [ "$v" != "$current" ] && list+=("{\"branch\":\"$b\",\"version\":\"$v\"}")
            if [ "$b" = "main" ]; then
              v=$(newest "$(next_series "$series")")
              [ -n "$v" ] && list+=("{\"branch\":\"main\",\"version\":\"$v\"}")
            fi
            echo "$b is on $current"
          done
          echo "matrix=[$(IFS=,; echo "${list[*]}")]" >> "$GITHUB_OUTPUT"
          echo "trying: ${list[*]:-nothing new}"

  rebase:
    name: Port ${{ matrix.branch }} onto ${{ matrix.version }}
    needs: pick
    if: needs.pick.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Apply overlay and patches three-way
        id: rebase
        run: |
          set +e
          REPORT="$RUNNER_TEMP/report.md" scripts/rebase.sh "${{ matrix.version }}" zabbix
          rc=$?
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || exit "$rc"
          echo "conflicts=$([ "$rc" -eq 3 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # Files new in the release are invisible to the patches but not to the
      # nmake build, which lists its objects by hand: show which sources appeared
      # under directories the proxy compiles.
      - name: List sources new in this release
        run: |
          cd zabbix
          old=$(tr -d '[:space:]' < ../UPSTREAM_VERSION)
          {
            echo
            echo "### Sources added upstream since $old"
            echo
            echo '```'
            git diff --name-only --diff-filter=A "$old" upstream -- 'src/libs/**/*.c' 'src/zabbix_proxy/**/*.c' | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the tree with its conflict markers
        if: steps.rebase.outputs.conflicts == 'yes'
        run: |
          cd zabbix
          git diff upstream > "$RUNNER_TEMP/port-on-${{ matrix.branch }}-${{ matrix.version }}.diff"

      - uses: actions/upload-artifact@v4
        if: steps.rebase.outputs.conflicts == 'yes'
        with:
          name: port-on-${{ matrix.branch }}-${{ matrix.version }}
          path: ${{ runner.temp }}/port-on-${{ matrix.branch }}-${{ matrix.version }}.diff

      - name: Fail the run when there is work to do
        if: steps.rebase.outputs.conflicts == 'yes'
        run: |
          echo "::warning::The port does not apply cleanly on ${{ matrix.version }}; see the summary."
          exit 1
